<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hollow Knight: Silksong — Web Port</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d11;
      color: #e6edf3;
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }
    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b0d11;
    }
    #fallback {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #fallback.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #fallback a {
      color: #58d5c9;
      text-decoration: none;
      border: 1px solid #58d5c9;
      padding: 8px 14px;
      border-radius: 4px;
    }
    #fallback a:hover { background: rgba(88, 213, 201, 0.12); }
    #fallback p { color: #8b949e; font-size: 13px; max-width: 460px; line-height: 1.5; }
    #file-tip {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 260px);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #262e3a;
      background: rgba(15, 18, 24, 0.92);
      color: #8b949e;
      font-size: 11px;
      line-height: 1.35;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    #file-tip.show { display: inline-flex; }
    #file-tip a {
      color: #58d5c9;
      text-decoration: none;
      white-space: nowrap;
      border: 1px solid rgba(88, 213, 201, 0.4);
      background: rgba(88, 213, 201, 0.1);
      padding: 2px 7px;
      border-radius: 4px;
    }
    #file-tip a:hover { background: rgba(88, 213, 201, 0.22); color: #e6edf3; }
    #file-tip button {
      border: 0;
      background: transparent;
      color: #8b949e;
      font: 13px/1 inherit;
      cursor: pointer;
      padding: 0 2px;
    }
    #file-tip button:hover { color: #e6edf3; }
  </style>
</head>
<body>
  <div id="fallback" role="status">
    <div>Hollow Knight: Silksong — Web Port</div>
    <p>Unable to load the embedded launcher. Open the web port directly instead:</p>
    <a href="https://d1qh2ou2210k6v.cloudfront.net/" rel="noopener">Open d1qh2ou2210k6v.cloudfront.net</a>
  </div>
  <iframe
    id="game-frame"
    src="https://d1qh2ou2210k6v.cloudfront.net/"
    title="Hollow Knight: Silksong Web Port"
    allow="fullscreen; gamepad; autoplay; clipboard-read; clipboard-write; keyboard-lock"
    allowfullscreen
  ></iframe>
  <div id="file-tip" role="note">
    <span>Local file mode: for full Offline Play &amp; shared browser saves, open directly</span>
    <a href="https://d1qh2ou2210k6v.cloudfront.net/" target="_blank" rel="noopener noreferrer">Open Direct Tab</a>
    <button id="file-tip-close" type="button" aria-label="Dismiss notice">×</button>
  </div>
  <script>
    (function () {
      var frame = document.getElementById("game-frame");
      var fallback = document.getElementById("fallback");
      var tip = document.getElementById("file-tip");
      var tipClose = document.getElementById("file-tip-close");
      var loaded = false;
      var timer = setTimeout(function () {
        if (!loaded) fallback.classList.add("visible");
      }, 15000);
      frame.addEventListener("load", function () {
        loaded = true;
        clearTimeout(timer);
        fallback.classList.remove("visible");
        try { frame.focus(); } catch (_) {}
      });
      frame.addEventListener("error", function () {
        clearTimeout(timer);
        fallback.classList.add("visible");
      });
      window.addEventListener("focus", function () {
        try { frame.focus(); } catch (_) {}
      });
      if (window.location && window.location.protocol === "file:" && tip) {
        tip.classList.add("show");
        var hideTip = function () {
          tip.classList.remove("show");
          try { frame.focus(); } catch (_) {}
        };
        if (tipClose) tipClose.addEventListener("click", hideTip);
        setTimeout(hideTip, 18000);
      }
    })();
  </script>
</body>
</html>
